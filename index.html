<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性签名 - 向死而生</title>
    <style>
        /* 全局重置与背景 */
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Georgia", "Times New Roman", serif;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 磨砂玻璃卡片 */
        .card {
            max-width: 700px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            padding: 60px 50px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* 核心签名样式 - 专门为四个字设计 */
        .signature {
            color: #f0eef8;
            font-size: 58px;          /* 大字显气势 */
            font-weight: bold;
            text-align: center;
            letter-spacing: 16px;      /* 字间距拉大，更显庄重 */
            line-height: 1.4;
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
        }

        /* 如果手机屏幕小，自适应缩小 */
        @media (max-width: 500px) {
            .signature {
                font-size: 38px;
                letter-spacing: 10px;
            }
            .card {
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 符号「」已经直接写在文字里，完美符合你的要求 -->
        <div class="signature">
            「如果你渴望得到某样东西，你得让它自由，如果它回到你身边，它就是属于你的，如果它不会回来，你就从未拥有过它。」
        </div>
    </div>
</body>
</html>
