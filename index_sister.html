<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性签名 - 长文版</title>
    <style>
        /* 全局重置与背景 */
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #2c209a, #302b63, #2020cf);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Georgia", "Times New Roman", serif;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 磨砂玻璃卡片（加宽以适应长句） */
        .card {
            max-width: 850px;          /* 比原来宽，防止长句频繁换行 */
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            padding: 50px 45px;
            border-radius: 32px;
            border: 1px solid rgba(121, 163, 41, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* 核心签名样式 —— 专为长文优化 */
        .signature {
            color: #f0eef8;
            font-size: 26px;           /* 字体缩小，腾出空间 */
            font-weight: 500;          /* 不要太粗，长文看着舒服 */
            text-align: left;          /* 长文左对齐比居中更易读 */
            letter-spacing: 1px;       /* 字间距收窄，不松散 */
            line-height: 2;            /* 行距拉大，阅读不累 */
            white-space: pre-wrap;     /* 保留你的换行 */
            word-break: break-word;
            text-shadow: 0 0 20px rgba(56, 16, 175, 0.15);
        }

        /* 自带装饰性大引号（自动生成） */
        .signature::before {
            content: "“";
            font-size: 48px;
            color: #a78bfa;
            display: block;
            line-height: 0.8;
            margin-bottom: 10px;
        }
        .signature::after {
            content: "”";
            font-size: 48px;
            color: #a78bfa;
            display: block;
            text-align: right;
            line-height: 0.8;
            margin-top: 15px;
        }

        /* 如果手机屏幕小，再自动缩小一点 */
        @media (max-width: 600px) {
            .signature {
                font-size: 20px;
                line-height: 1.9;
            }
            .card {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- ↓ 在这里粘贴你的长篇个性签名，想写多长写多长 ↓ -->
        <div class="signature">
	<人生到处知何似，应似飞鸿踏雪泥>
        </div>
    </div>
</body>
</html>
